name: check instructions
description: Check AGENTS.md and SYSTEM.md files against the agent instruction budget.

# A composite action, not a reusable workflow: it runs as a step in the
# caller's job, so it starts no extra runner, and github.action_path gives the
# script at the same ref the caller pinned. Needs python3 on the runner, which
# ubuntu-latest has.
#
# Inputs reach the shell through env, not ${{ }} interpolation, so a crafted
# input cannot inject commands.

inputs:
  files:
    description: Space-separated instruction files to check, relative to the working directory.
    default: AGENTS.md
  byte-limit:
    description: Override the byte limit. Empty uses the script default.
    default: ""
  rule-limit:
    description: Override the rule warning threshold. Empty uses the script default.
    default: ""

runs:
  using: composite
  steps:
    - shell: bash
      env:
        FILES: ${{ inputs.files }}
        BYTE_LIMIT: ${{ inputs.byte-limit }}
        RULE_LIMIT: ${{ inputs.rule-limit }}
        SCRIPT: ${{ github.action_path }}/check-instructions.py
      run: |
        args=()
        [ -n "$BYTE_LIMIT" ] && args+=(--byte-limit "$BYTE_LIMIT")
        [ -n "$RULE_LIMIT" ] && args+=(--rule-limit "$RULE_LIMIT")
        read -ra files <<<"$FILES"
        python3 "$SCRIPT" "${args[@]}" "${files[@]}"
