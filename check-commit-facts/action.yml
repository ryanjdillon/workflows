name: check commit facts
description: Check that the commit messages in a range name a source for the part numbers they state.

# A composite action, not a reusable workflow: it runs as a step in the
# caller's job, so it starts no extra runner, and github.action_path gives the
# script at the same ref the caller pinned. Needs python3 and git on the
# runner, which ubuntu-latest has.
#
# The commits of the range must be in the clone. Check out with
# `fetch-depth: 0`.
#
# Inputs reach the shell through env, not ${{ }} interpolation, so a crafted
# input cannot inject commands.

inputs:
  range:
    description: >-
      A git revision range. Empty uses the event: base..head of a pull request,
      or before..after of a push.
    default: ""
  patterns:
    description: Regexes for a part number, one on each line. They replace the script default. Empty uses the default.
    default: ""

runs:
  using: composite
  steps:
    - shell: bash
      env:
        RANGE: ${{ inputs.range }}
        PATTERNS: ${{ inputs.patterns }}
        PR_BASE: ${{ github.event.pull_request.base.sha }}
        PR_HEAD: ${{ github.event.pull_request.head.sha }}
        PUSH_BEFORE: ${{ github.event.before }}
        PUSH_AFTER: ${{ github.event.after }}
        SCRIPT: ${{ github.action_path }}/check-commit-facts.py
      run: |
        if [ -z "$RANGE" ]; then
          if [ -n "$PR_BASE" ]; then
            RANGE="$PR_BASE..$PR_HEAD"
          elif [ -n "$PUSH_AFTER" ] && [ -n "${PUSH_BEFORE//0/}" ]; then
            RANGE="$PUSH_BEFORE..$PUSH_AFTER"
          elif [ -n "$PUSH_AFTER" ]; then
            # A push that makes a new branch has no "before" commit.
            RANGE="$PUSH_AFTER^!"
          else
            echo "error: this event gives no commit range; set the range input" >&2
            exit 1
          fi
        fi
        args=(--range "$RANGE")
        while IFS= read -r pattern; do
          if [ -n "$pattern" ]; then args+=(--pattern "$pattern"); fi
        done <<<"$PATTERNS"
        python3 "$SCRIPT" "${args[@]}"
