name: security

# Run security-scan.yml from this checkout on this repo, so a change to it is
# tested before it merges. The weekly run scans the full history.

on:
  pull_request:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# A new push to a PR cancels the scan of the old head.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    uses: ./.github/workflows/security-scan.yml
