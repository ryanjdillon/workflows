name: nix check

# Run `nix flake check` for a change to Nix files only. Normal CI does not
# install Nix: a cold install and toolchain download cost minutes on each run.
#
# A reusable workflow cannot filter on paths itself. The caller filters, in a
# workflow of its own:
#
#   on:
#     pull_request:
#       paths: ["**.nix", "flake.lock"]
#
# Third-party actions are pinned by commit SHA: a tag is mutable.

on:
  workflow_call:
    inputs:
      command:
        description: The command to run after Nix is installed.
        default: nix flake check
        type: string

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3

      - name: Check
        env:
          COMMAND: ${{ inputs.command }}
        run: bash -c "$COMMAND"
