name: check

# CI for this repo. It runs each adapter of each shared check on the test
# data, and audits the workflows and actions. It does not install Nix: nix.yml
# runs the Nix adapter, only for changes to Nix files or to the checks.
#
# Third-party actions are pinned by commit SHA: a tag is mutable.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check-instructions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: This repo's AGENTS.md
        uses: ./check-instructions

      - name: Action passes on good files
        uses: ./check-instructions
        with:
          files: check-instructions/testdata/pass/AGENTS.md check-instructions/testdata/pass/SYSTEM.md

      - name: Action fails on an AGENTS.md with no SYSTEM.md section
        id: no-section
        continue-on-error: true
        uses: ./check-instructions
        with:
          files: check-instructions/testdata/fail/AGENTS.md

      - name: Action fails on a file over the byte limit
        id: too-large
        continue-on-error: true
        uses: ./check-instructions
        with:
          files: check-instructions/testdata/pass/AGENTS.md
          byte-limit: "10"

      - name: The bad files failed
        env:
          NO_SECTION: ${{ steps.no-section.outcome }}
          TOO_LARGE: ${{ steps.too-large.outcome }}
        run: |
          [ "$NO_SECTION" = failure ] || { echo "error: no-section passed" >&2; exit 1; }
          [ "$TOO_LARGE" = failure ] || { echo "error: too-large passed" >&2; exit 1; }

      # latest-known is the newest prek that this action release has a
      # checksum for. A newer version installs with no checksum check. Thus
      # prek moves only when Renovate moves the action pin.
      - uses: j178/prek-action@7b101f8338a08d2bd6fdb3625e4e7692428763a3 # v3.1.1
        with:
          prek-version: latest-known
          install-only: true

      - name: Hook
        run: check-instructions/test-hook.sh

  check-process-noise:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Unit tests
        run: python3 -m unittest discover -s check-process-noise

      - name: This repo's Python
        uses: ./check-process-noise
        with:
          exclude: "*/testdata/*"

      - name: Action passes on good files
        uses: ./check-process-noise
        with:
          files: check-process-noise/testdata/pass/clean.py

      - name: Action fails on an issue id in a comment
        id: noisy
        continue-on-error: true
        uses: ./check-process-noise
        with:
          files: check-process-noise/testdata/fail/noisy.py

      - name: Action uses the patterns that the caller gives
        id: patterns
        continue-on-error: true
        uses: ./check-process-noise
        with:
          files: check-process-noise/testdata/pass/clean.py
          patterns: |
            \blinear search\b

      - name: The bad files failed
        env:
          NOISY: ${{ steps.noisy.outcome }}
          PATTERNS: ${{ steps.patterns.outcome }}
        run: |
          [ "$NOISY" = failure ] || { echo "error: noisy passed" >&2; exit 1; }
          [ "$PATTERNS" = failure ] || { echo "error: patterns passed" >&2; exit 1; }

      # See the check-instructions job for the prek version.
      - uses: j178/prek-action@7b101f8338a08d2bd6fdb3625e4e7692428763a3 # v3.1.1
        with:
          prek-version: latest-known
          install-only: true

      - name: Hook
        run: check-process-noise/test-hook.sh

  check-commit-facts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The action reads each commit of the range.
          fetch-depth: 0

      - name: Unit tests
        run: python3 -m unittest discover -s check-commit-facts

      - name: This change's commits
        uses: ./check-commit-facts

      # See the check-instructions job for the prek version.
      - uses: j178/prek-action@7b101f8338a08d2bd6fdb3625e4e7692428763a3 # v3.1.1
        with:
          prek-version: latest-known
          install-only: true

      - name: Hook
        run: check-commit-facts/test-hook.sh

  check-skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Unit tests
        run: python3 -m unittest discover -s check-skills

      - name: Action passes on good skills
        uses: ./check-skills
        with:
          roots: check-skills/testdata/pass/skills

      - name: Action fails on bad skills
        id: bad
        continue-on-error: true
        uses: ./check-skills
        with:
          roots: check-skills/testdata/fail/skills

      - name: The bad skills failed
        env:
          BAD: ${{ steps.bad.outcome }}
        run: |
          [ "$BAD" = failure ] || { echo "error: bad skills passed" >&2; exit 1; }

      # See the check-instructions job for the prek version.
      - uses: j178/prek-action@7b101f8338a08d2bd6fdb3625e4e7692428763a3 # v3.1.1
        with:
          prek-version: latest-known
          install-only: true

      - name: Hook
        run: check-skills/test-hook.sh

  check-conventional-commits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The action reads each commit of the range.
          fetch-depth: 0

      - name: Unit tests
        run: python3 -m unittest discover -s check-conventional-commits

      # A push to main has the merge commit of the pull request. The pull
      # request has no merge commits.
      - name: This change's commits and the PR title
        uses: ./check-conventional-commits
        with:
          allow-merge-commits: ${{ github.event_name == 'push' }}

      # This range is the merge commit of pull request #16.
      - name: Action fails on a merge commit
        id: merge
        continue-on-error: true
        uses: ./check-conventional-commits
        with:
          range: da9dcca0713460e006ac81365674eff1f227c9d9^!
          check-pr-title: "false"

      - name: Action accepts a merge commit when the caller allows it
        uses: ./check-conventional-commits
        with:
          range: da9dcca0713460e006ac81365674eff1f227c9d9^!
          check-pr-title: "false"
          allow-merge-commits: "true"

      - name: The merge commit failed
        env:
          MERGE: ${{ steps.merge.outcome }}
        run: |
          [ "$MERGE" = failure ] || { echo "error: the merge commit passed" >&2; exit 1; }

      # See the check-instructions job for the prek version.
      - uses: j178/prek-action@7b101f8338a08d2bd6fdb3625e4e7692428763a3 # v3.1.1
        with:
          prek-version: latest-known
          install-only: true

      - name: Hook
        run: check-conventional-commits/test-hook.sh

  check-commit-trailer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The action reads each commit of the range.
          fetch-depth: 0

      - name: Unit tests
        run: python3 -m unittest discover -s check-commit-trailer

      # This repo's commits have no trailer. This range is commit 89cf09d of
      # main, by the author ryanjdillon.
      - name: Action passes on a commit by an exempt author
        uses: ./check-commit-trailer
        with:
          range: 89cf09d01380a6b2ccdfc24f06deac2d9786d04c^!
          exempt-authors: |
            renovate[bot]
            ryanjdillon

      - name: Action fails on a commit with no trailer
        id: no-trailer
        continue-on-error: true
        uses: ./check-commit-trailer
        with:
          range: 89cf09d01380a6b2ccdfc24f06deac2d9786d04c^!

      - name: The commit with no trailer failed
        env:
          NO_TRAILER: ${{ steps.no-trailer.outcome }}
        run: |
          [ "$NO_TRAILER" = failure ] || { echo "error: no-trailer passed" >&2; exit 1; }

      # See the check-instructions job for the prek version.
      - uses: j178/prek-action@7b101f8338a08d2bd6fdb3625e4e7692428763a3 # v3.1.1
        with:
          prek-version: latest-known
          install-only: true

      - name: Hook
        run: check-commit-trailer/test-hook.sh

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: actionlint
        uses: docker://rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: -color

      - uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          advanced-security: false

      - uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
        with:
          version: 0.17.4
          args: format --check

      - uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
        with:
          version: 0.17.4
