name: check commit trailer
description: "Check that each commit in a range has an issue trailer, for example `Paperclip: PCL-12`."

# A composite action, not a reusable workflow: it runs as a step in the
# caller's job, so it starts no extra runner, and github.action_path gives the
# script at the same ref the caller pinned. Needs python3 and git on the
# runner, which ubuntu-latest has.
#
# The commits of the range must be in the clone. Check out with
# `fetch-depth: 0`.
#
# Inputs reach the shell through env, not ${{ }} interpolation, so a crafted
# input cannot inject commands. Each value goes in the same argument as its
# option (--key=VALUE), so a value that starts with `--` is not read as an
# option.

inputs:
  range:
    description: >-
      A git revision range. Empty uses the event: merge-base..head of a pull request,
      or before..after of a push. For a push that makes a branch, or a force
      push, it uses origin/<default branch>..after.
    default: ""
  exempt-authors:
    description: >-
      Author names whose commits need no trailer, one on each line, for
      example the owner and `renovate[bot]`. Empty checks every author.
    default: ""
  key:
    description: The trailer key. Empty uses the script default, `Paperclip`.
    default: ""
  value-pattern:
    description: >-
      A regex that the whole trailer value must match. Empty uses the script
      default, `PCL-[1-9]\d*`.
    default: ""

runs:
  using: composite
  steps:
    - shell: bash
      env:
        RANGE: ${{ inputs.range }}
        EXEMPT_AUTHORS: ${{ inputs.exempt-authors }}
        KEY: ${{ inputs.key }}
        VALUE_PATTERN: ${{ inputs.value-pattern }}
        PR_BASE: ${{ github.event.pull_request.base.sha }}
        PR_HEAD: ${{ github.event.pull_request.head.sha }}
        PUSH_BEFORE: ${{ github.event.before }}
        PUSH_AFTER: ${{ github.event.after }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        SCRIPT: ${{ github.action_path }}/check-commit-trailer.py
      run: |
        if [ "$(git rev-parse --is-shallow-repository)" = true ]; then
          echo "error: the clone is shallow; check out with fetch-depth: 0" >&2
          exit 1
        fi
        if [ -z "$RANGE" ]; then
          if [ -n "$PR_BASE" ]; then
            # From the merge base, so that a stale base.sha does not add the
            # commits of the base branch to the range.
            if ! merge_base="$(git merge-base "$PR_BASE" "$PR_HEAD")"; then
              echo "error: no merge base of $PR_BASE and $PR_HEAD in the clone" >&2
              exit 1
            fi
            RANGE="$merge_base..$PR_HEAD"
          elif [ -n "$PUSH_AFTER" ]; then
            if [ -n "${PUSH_BEFORE//0/}" ] && git cat-file -e "$PUSH_BEFORE^{commit}" 2>/dev/null; then
              RANGE="$PUSH_BEFORE..$PUSH_AFTER"
            else
              # A push that makes a branch has no "before" commit. After a
              # force push, the "before" commit is not in the clone. Then
              # check the commits that the default branch does not have.
              if [ -n "${PUSH_BEFORE//0/}" ]; then
                reason="the commit before the push is not in the clone"
              else
                reason="the push makes a new branch"
              fi
              if [ -n "$DEFAULT_BRANCH" ] \
                && git rev-parse -q --verify "origin/$DEFAULT_BRANCH^{commit}" >/dev/null; then
                RANGE="origin/$DEFAULT_BRANCH..$PUSH_AFTER"
              else
                RANGE="$PUSH_AFTER^!"
              fi
              echo "check-commit-trailer: $reason; checking $RANGE"
            fi
          else
            echo "error: this event gives no commit range; set the range input" >&2
            exit 1
          fi
        fi
        args=("--range=$RANGE")
        if [ -n "$KEY" ]; then args+=("--key=$KEY"); fi
        if [ -n "$VALUE_PATTERN" ]; then args+=("--value-pattern=$VALUE_PATTERN"); fi
        while IFS= read -r author; do
          if [ -n "$author" ]; then args+=("--exempt-author=$author"); fi
        done <<<"$EXEMPT_AUTHORS"
        python3 "$SCRIPT" "${args[@]}"
